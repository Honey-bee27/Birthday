<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>✨ A little something for you</title>

  <!-- Stealth share preview — keeps the surprise hidden -->
  <meta name="description" content="Open this, it's just for you 🤍" />
  <meta property="og:title" content="✨ A little something for you" />
  <meta property="og:description" content="Open this, it's just for you 🤍" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="✨ A little something for you" />
  <meta name="twitter:description" content="Open this, it's just for you 🤍" />
  <meta name="robots" content="noindex, nofollow" />

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Cinzel+Decorative:wght@400;700&family=Great+Vibes&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #06080f;
      --white: #ffffff;
      --cream: #f5f0e8;
      --soft: rgba(255,255,255,0.12);
      --glow: rgba(255,255,255,0.6);
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Cormorant Garamond', serif;
      cursor: none;
    }

    /* ── CURSOR ── */
    #cursor {
      position: fixed; width: 18px; height: 18px;
      border: 1.5px solid rgba(255,255,255,0.7);
      border-radius: 50%; pointer-events: none; z-index: 9999;
      transform: translate(-50%,-50%);
      transition: transform 0.1s ease;
    }

    /* ── STARFIELD ── */
    #stars { position: fixed; inset: 0; pointer-events: none; z-index: 0; }

    /* ── CANVAS for particles ── */
    #canvas { position: fixed; inset: 0; pointer-events: none; z-index: 1; }

    /* ── FLOATING ELEMENTS ── */
    .float-layer { position: fixed; inset: 0; pointer-events: none; z-index: 2; overflow: hidden; }

    /* ── PAGES ── */
    .page {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 10;
      transition: opacity 0.8s ease, transform 0.8s ease;
    }
    .page.hidden { opacity: 0; pointer-events: none; transform: scale(0.96); }

    /* ── COUNTDOWN PAGE ── */
    #countdown-page { gap: 40px; }

    .until-text {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(13px, 2vw, 16px);
      font-weight: 300;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.5);
      animation: fadeSlideDown 1.2s ease forwards;
      opacity: 0;
    }

    .main-title-cd {
      font-family: 'Great Vibes', cursive;
      font-size: clamp(52px, 9vw, 110px);
      color: var(--white);
      text-shadow: 0 0 60px rgba(255,255,255,0.25), 0 0 120px rgba(255,255,255,0.1);
      animation: fadeSlideDown 1.2s ease 0.3s forwards;
      opacity: 0;
      text-align: center;
      line-height: 1;
    }

    .date-line {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(14px, 2.5vw, 22px);
      font-weight: 300;
      letter-spacing: 4px;
      color: rgba(255,255,255,0.6);
      animation: fadeSlideDown 1.2s ease 0.5s forwards;
      opacity: 0;
    }

    /* Timer */
    .timer-wrap {
      display: flex; gap: clamp(16px, 4vw, 48px);
      animation: fadeSlideDown 1.2s ease 0.7s forwards;
      opacity: 0;
    }

    .timer-block {
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      position: relative;
    }

    .timer-num {
      font-family: 'Cinzel Decorative', serif;
      font-size: clamp(44px, 9vw, 100px);
      font-weight: 700;
      color: var(--white);
      line-height: 1;
      text-shadow: 0 0 40px rgba(255,255,255,0.3);
      min-width: clamp(80px, 14vw, 160px);
      text-align: center;
      position: relative;
    }
    .timer-num::after {
      content: '';
      display: block;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
      margin-top: 6px;
    }

    .timer-label {
      font-size: clamp(9px, 1.5vw, 13px);
      letter-spacing: 4px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.35);
      font-weight: 300;
    }

    .timer-colon {
      font-family: 'Cinzel Decorative', serif;
      font-size: clamp(36px, 7vw, 80px);
      color: rgba(255,255,255,0.2);
      line-height: 1;
      padding-top: 4px;
      animation: pulse 1s infinite;
    }

    /* small tulip row under timer */
    .tulip-divider {
      display: flex; gap: 20px; align-items: center;
      animation: fadeSlideDown 1.2s ease 0.9s forwards;
      opacity: 0;
    }
    .tulip-divider .line {
      width: clamp(40px, 8vw, 120px); height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3));
    }
    .tulip-divider .line:last-child {
      background: linear-gradient(270deg, transparent, rgba(255,255,255,0.3));
    }

    /* ── BIRTHDAY PAGE ── */
    #birthday-page { gap: 0; }

    .bday-bg-glow {
      position: fixed; inset: 0; z-index: -1;
      background: radial-gradient(ellipse 80% 60% at 50% 40%, rgba(255,255,255,0.06) 0%, transparent 70%);
      animation: glowPulse 3s ease infinite;
    }

    .bday-inner {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: clamp(12px, 3vh, 28px);
      padding: 20px;
      text-align: center;
    }

    .bday-top {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(11px, 1.8vw, 15px);
      letter-spacing: 8px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.4);
      animation: revealUp 1s ease forwards;
      opacity: 0;
    }

    .bday-main {
      font-family: 'Great Vibes', cursive;
      font-size: clamp(64px, 13vw, 160px);
      color: var(--white);
      line-height: 0.95;
      text-shadow:
        0 0 30px rgba(255,255,255,0.5),
        0 0 80px rgba(255,255,255,0.2),
        0 0 160px rgba(255,255,255,0.1);
      animation: revealUp 1s ease 0.2s forwards;
      opacity: 0;
    }

    .bday-sub {
      font-family: 'Great Vibes', cursive;
      font-size: clamp(36px, 7vw, 90px);
      color: rgba(255,255,255,0.85);
      text-shadow: 0 0 40px rgba(255,255,255,0.3);
      animation: revealUp 1s ease 0.4s forwards;
      opacity: 0;
    }

    .bday-divider {
      display: flex; align-items: center; gap: 16px;
      animation: revealUp 1s ease 0.6s forwards;
      opacity: 0;
    }
    .bday-divider span {
      font-size: 22px; color: rgba(255,255,255,0.5);
    }
    .bday-divider .dl {
      width: 80px; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3));
    }
    .bday-divider .dl:last-child {
      background: linear-gradient(270deg, transparent, rgba(255,255,255,0.3));
    }

    .bday-msg {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(15px, 2.5vw, 22px);
      font-weight: 300;
      font-style: italic;
      color: rgba(255,255,255,0.65);
      max-width: 540px;
      line-height: 1.8;
      animation: revealUp 1s ease 0.8s forwards;
      opacity: 0;
      letter-spacing: 0.5px;
    }

    .bday-date-tag {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(12px, 1.8vw, 16px);
      letter-spacing: 6px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.3);
      animation: revealUp 1s ease 1s forwards;
      opacity: 0;
    }

    /* Tulip garden row */
    .tulip-row {
      display: flex; gap: clamp(8px, 3vw, 32px);
      align-items: flex-end;
      animation: revealUp 1.2s ease 1.2s forwards;
      opacity: 0;
    }

    /* ── SVG TULIP ── */
    .tulip-svg { filter: drop-shadow(0 0 12px rgba(255,255,255,0.3)); }

    /* ── FLOATING HEARTS ── */
    .heart {
      position: absolute;
      color: rgba(255,255,255,0.15);
      font-size: 20px;
      animation: floatHeart linear infinite;
      pointer-events: none;
      user-select: none;
    }

    /* ── FLOATING TULIPS ── */
    .ftulip {
      position: absolute;
      opacity: 0.07;
      animation: floatTulip linear infinite;
      pointer-events: none;
    }

    /* ── KEYFRAMES ── */
    @keyframes fadeSlideDown {
      from { opacity: 0; transform: translateY(-16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes revealUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulse {
      0%,100% { opacity: 0.2; } 50% { opacity: 0.7; }
    }
    @keyframes glowPulse {
      0%,100% { opacity: 1; } 50% { opacity: 0.6; }
    }
    @keyframes floatHeart {
      0%   { transform: translateY(110vh) rotate(0deg) scale(0.8); opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 0.8; }
      100% { transform: translateY(-10vh) rotate(30deg) scale(1.2); opacity: 0; }
    }
    @keyframes floatTulip {
      0%   { transform: translateY(110vh) rotate(-10deg); opacity: 0; }
      10%  { opacity: 0.08; }
      90%  { opacity: 0.06; }
      100% { transform: translateY(-10vh) rotate(10deg); opacity: 0; }
    }
    @keyframes starTwinkle {
      0%,100% { opacity: 0.6; } 50% { opacity: 0.1; }
    }
    @keyframes numFlip {
      0%   { transform: rotateX(0deg); }
      50%  { transform: rotateX(-90deg); }
      100% { transform: rotateX(0deg); }
    }
    @keyframes burst {
      0%   { transform: scale(0) rotate(0deg); opacity: 1; }
      100% { transform: scale(2.5) rotate(360deg); opacity: 0; }
    }

    /* ── SPARKLE burst on birthday reveal ── */
    .sparkle {
      position: fixed;
      pointer-events: none;
      z-index: 20;
      font-size: 24px;
      animation: burst 1.5s ease forwards;
    }

    /* ── MOBILE ── */
    @media (max-width: 480px) {
      .timer-wrap { gap: 10px; }
      .timer-colon { display: none; }
    }
  </style>
</head>
<body>

<!-- Custom cursor -->
<div id="cursor"></div>

<!-- Stars -->
<div id="stars"></div>

<!-- Floating elements layer -->
<div class="float-layer" id="floatLayer"></div>

<!-- Canvas for extra particles -->
<canvas id="canvas"></canvas>

<!-- ===== COUNTDOWN PAGE ===== -->
<div class="page" id="countdown-page">
  <p class="until-text">Counting down to something magical</p>
  <h1 class="main-title-cd">Special Day</h1>

  <div class="timer-wrap">
    <div class="timer-block">
      <div class="timer-num" id="days">00</div>
      <div class="timer-label">Days</div>
    </div>
    <div class="timer-colon">:</div>
    <div class="timer-block">
      <div class="timer-num" id="hours">00</div>
      <div class="timer-label">Hours</div>
    </div>
    <div class="timer-colon">:</div>
    <div class="timer-block">
      <div class="timer-num" id="minutes">00</div>
      <div class="timer-label">Minutes</div>
    </div>
    <div class="timer-colon">:</div>
    <div class="timer-block">
      <div class="timer-num" id="seconds">00</div>
      <div class="timer-label">Seconds</div>
    </div>
  </div>

  <div class="tulip-divider">
    <div class="line"></div>
    <!-- small tulip icon -->
    <svg width="28" height="40" viewBox="0 0 28 40" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M14 30 Q14 20 14 10 Q10 6 6 10 Q4 18 10 24 Q12 27 14 30Z" fill="rgba(255,255,255,0.4)"/>
      <path d="M14 30 Q14 20 14 10 Q18 6 22 10 Q24 18 18 24 Q16 27 14 30Z" fill="rgba(255,255,255,0.25)"/>
      <line x1="14" y1="30" x2="14" y2="40" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
    </svg>
    <div class="line"></div>
  </div>

  <p style="font-family:'Cormorant Garamond',serif; font-size:clamp(13px,2vw,17px); font-weight:300; font-style:italic; color:rgba(255,255,255,0.35); animation:fadeSlideDown 1.2s ease 1.1s forwards; opacity:0; letter-spacing:1px;">
    Every second brings you closer to your bloom 🌷
  </p>
</div>

<!-- ===== BIRTHDAY PAGE ===== -->
<div class="page hidden" id="birthday-page">
  <div class="bday-bg-glow"></div>
  <div class="bday-inner">
    <p class="bday-top">✦ Today is your day ✦</p>
    <h1 class="bday-main">Happy</h1>
    <h1 class="bday-sub">Birthday!</h1>

    <div class="bday-divider">
      <div class="dl"></div>
      <span>🤍</span>
      <div class="dl"></div>
    </div>

    <p class="bday-msg">
      May your life always bloom like a tulip in spring —<br/>
      pure, beautiful, and full of light.
    </p>

    <div class="tulip-row" id="tulipRow"></div>

    <p class="bday-date-tag">27 · June · 2026</p>
  </div>
</div>

<script>
/* ── CURSOR ── */
const cur = document.getElementById('cursor');
document.addEventListener('mousemove', e => {
  cur.style.left = e.clientX + 'px';
  cur.style.top  = e.clientY + 'px';
});

/* ── STARS ── */
(function buildStars() {
  const s = document.getElementById('stars');
  for (let i = 0; i < 180; i++) {
    const d = document.createElement('div');
    const size = Math.random() * 2.5 + 0.5;
    d.style.cssText = `
      position:absolute;
      width:${size}px; height:${size}px;
      border-radius:50%;
      background:white;
      left:${Math.random()*100}%;
      top:${Math.random()*100}%;
      opacity:${Math.random()*0.7+0.1};
      animation: starTwinkle ${Math.random()*4+2}s ease infinite;
      animation-delay:${Math.random()*5}s;
    `;
    s.appendChild(d);
  }
})();

/* ── TULIP SVG builder ── */
function makeTulipSVG(size=60, opacity=1) {
  const h = size; const w = size * 0.6;
  const stemH = size * 0.45;
  const petalW = w * 0.55;
  return `<svg width="${w}" height="${h + stemH}" viewBox="0 0 ${w} ${h + stemH}" fill="none" xmlns="http://www.w3.org/2000/svg" class="tulip-svg" style="opacity:${opacity}">
    <!-- left petal -->
    <path d="M${w/2} ${h*0.85}
      Q${w/2 - petalW*1.1} ${h*0.55}
        ${w/2 - petalW*0.6} ${h*0.12}
      Q${w/2 - petalW*0.1} ${h*0.02}
        ${w/2} ${h*0.22}
      Q${w/2 - petalW*0.15} ${h*0.52}
        ${w/2} ${h*0.85}Z"
      fill="rgba(255,255,255,0.85)" stroke="rgba(255,255,255,0.3)" stroke-width="0.5"/>
    <!-- right petal -->
    <path d="M${w/2} ${h*0.85}
      Q${w/2 + petalW*1.1} ${h*0.55}
        ${w/2 + petalW*0.6} ${h*0.12}
      Q${w/2 + petalW*0.1} ${h*0.02}
        ${w/2} ${h*0.22}
      Q${w/2 + petalW*0.15} ${h*0.52}
        ${w/2} ${h*0.85}Z"
      fill="rgba(255,255,255,0.65)" stroke="rgba(255,255,255,0.3)" stroke-width="0.5"/>
    <!-- center petal -->
    <path d="M${w/2} ${h*0.88}
      Q${w/2 - petalW*0.5} ${h*0.5}
        ${w/2} ${h*0.05}
      Q${w/2 + petalW*0.5} ${h*0.5}
        ${w/2} ${h*0.88}Z"
      fill="rgba(255,255,255,0.95)" stroke="rgba(255,255,255,0.4)" stroke-width="0.5"/>
    <!-- stem -->
    <line x1="${w/2}" y1="${h*0.88}" x2="${w/2}" y2="${h + stemH}" stroke="rgba(255,255,255,0.4)" stroke-width="1.8" stroke-linecap="round"/>
    <!-- leaf -->
    <path d="M${w/2} ${h + stemH*0.35}
      Q${w/2 - petalW*0.8} ${h + stemH*0.15}
        ${w/2 - petalW*0.4} ${h + stemH*0.6}
      Q${w/2 - petalW*0.1} ${h + stemH*0.55}
        ${w/2} ${h + stemH*0.35}Z"
      fill="rgba(255,255,255,0.25)"/>
  </svg>`;
}

/* ── FLOATING HEARTS & TULIPS ── */
(function buildFloating() {
  const layer = document.getElementById('floatLayer');
  // Hearts
  for (let i = 0; i < 24; i++) {
    const h = document.createElement('div');
    h.className = 'heart';
    h.innerHTML = '🤍';
    const size = Math.random() * 18 + 10;
    const dur  = Math.random() * 14 + 10;
    const delay = Math.random() * 15;
    h.style.cssText = `
      left:${Math.random()*100}%;
      font-size:${size}px;
      animation-duration:${dur}s;
      animation-delay:${delay}s;
    `;
    layer.appendChild(h);
  }
  // Floating tulips
  for (let i = 0; i < 10; i++) {
    const t = document.createElement('div');
    t.className = 'ftulip';
    const sz = Math.floor(Math.random()*50 + 40);
    const dur  = Math.random()*20 + 18;
    const delay= Math.random()*20;
    t.style.cssText = `
      left:${Math.random()*100}%;
      animation-duration:${dur}s;
      animation-delay:${delay}s;
    `;
    t.innerHTML = makeTulipSVG(sz, 1);
    layer.appendChild(t);
  }
})();

/* ── BUILD BIRTHDAY TULIP ROW ── */
(function buildBdayTulips() {
  const row = document.getElementById('tulipRow');
  const sizes = [55, 70, 85, 100, 85, 70, 55];
  const opacities = [0.5, 0.7, 0.9, 1, 0.9, 0.7, 0.5];
  sizes.forEach((sz, i) => {
    const wrap = document.createElement('div');
    wrap.innerHTML = makeTulipSVG(sz, opacities[i]);
    row.appendChild(wrap);
  });
})();

/* ── COUNTDOWN ── */
const target = new Date('2026-06-27T00:00:00');

function pad(n) { return String(n).padStart(2,'0'); }

function updateTimer() {
  const now  = new Date();
  const diff = target - now;

  if (diff <= 0) {
    showBirthday();
    return;
  }

  const d = Math.floor(diff / 86400000);
  const h = Math.floor((diff % 86400000) / 3600000);
  const m = Math.floor((diff % 3600000)  / 60000);
  const s = Math.floor((diff % 60000)    / 1000);

  const els = { days: d, hours: h, minutes: m, seconds: s };
  for (const [id, val] of Object.entries(els)) {
    const el = document.getElementById(id);
    const newVal = pad(val);
    if (el.textContent !== newVal) {
      el.style.animation = 'none';
      el.offsetHeight; // reflow
      el.style.animation = '';
      el.textContent = newVal;
    }
  }
}

updateTimer();
const timerInterval = setInterval(updateTimer, 1000);

/* ── SHOW BIRTHDAY ── */
function showBirthday() {
  clearInterval(timerInterval);
  const cdPage = document.getElementById('countdown-page');
  const bdPage = document.getElementById('birthday-page');

  cdPage.classList.add('hidden');
  setTimeout(() => {
    bdPage.classList.remove('hidden');
    launchSparkles();
    launchBirthdayHearts();
  }, 400);
}

function launchSparkles() {
  const emojis = ['✨','🌷','🤍','💫','🌸','❄️'];
  for (let i = 0; i < 30; i++) {
    setTimeout(() => {
      const el = document.createElement('div');
      el.className = 'sparkle';
      el.textContent = emojis[Math.floor(Math.random()*emojis.length)];
      el.style.left  = Math.random()*90+5 + '%';
      el.style.top   = Math.random()*90+5 + '%';
      el.style.fontSize = Math.random()*20+16 + 'px';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 1800);
    }, i * 80);
  }
}

function launchBirthdayHearts() {
  // Add extra hearts to float layer for birthday
  const layer = document.getElementById('floatLayer');
  for (let i = 0; i < 20; i++) {
    const h = document.createElement('div');
    h.className = 'heart';
    h.innerHTML = '🤍';
    h.style.cssText = `
      left:${Math.random()*100}%;
      font-size:${Math.random()*22+12}px;
      animation-duration:${Math.random()*10+8}s;
      animation-delay:${Math.random()*3}s;
      color:rgba(255,255,255,0.25);
    `;
    layer.appendChild(h);
  }
}

/* ── CANVAS particles (subtle shimmer) ── */
(function initCanvas() {
  const canvas = document.getElementById('canvas');
  const ctx    = canvas.getContext('2d');
  let W, H, particles = [];

  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  for (let i = 0; i < 60; i++) {
    particles.push({
      x: Math.random()*window.innerWidth,
      y: Math.random()*window.innerHeight,
      r: Math.random()*1.5+0.3,
      vx: (Math.random()-0.5)*0.3,
      vy: (Math.random()-0.5)*0.3,
      a: Math.random()*0.4+0.05,
    });
  }

  function draw() {
    ctx.clearRect(0,0,W,H);
    particles.forEach(p => {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      ctx.fillStyle = `rgba(255,255,255,${p.a})`;
      ctx.fill();
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0) p.x = W; if (p.x > W) p.x = 0;
      if (p.y < 0) p.y = H; if (p.y > H) p.y = 0;
    });
    requestAnimationFrame(draw);
  }
  draw();
})();
